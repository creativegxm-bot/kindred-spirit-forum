name: Detect AI Content Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  offline:
    name: Offline unit tests (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run lib_test.ts (no network, no secrets)
        run: deno test supabase/functions/detect-ai-content/lib_test.ts

  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run index_test.ts against deployed function
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/detect-ai-content/index_test.ts

  video:
    name: Video fixture suite (codec + aspect-ratio matrix)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Runs only the "video fixture: *" tests defined in index_test.ts.
      # Each asserts ai_probability is a finite number and falls within the
      # per-fixture [minProbability, maxProbability] bounds declared in
      # fixtures.ts (VIDEO_FIXTURES). Any NaN, Infinity, or out-of-bounds
      # score fails the job.
      - name: Run video fixture suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --filter "video fixture" \
            supabase/functions/detect-ai-content/index_test.ts